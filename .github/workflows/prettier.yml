name: Prettier

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only changed files are checked while the repository still has
      # pre-existing formatting drift. Switch to `prettier --check .`
      # once the whole tree is formatted.
      - name: Check changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only -z --diff-filter=ACMR "FETCH_HEAD...HEAD" -- '*.js' '*.md' \
            | xargs -0 -r npx --no-install prettier --check
